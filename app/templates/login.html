<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Accedi — HoReCa Leads</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">H</span>
      <div style="font-weight: 700; letter-spacing: -0.02em;">HoReCa Leads</div>
    </div>

    {% if errore %}
      <div class="alert alert-errore">{{ errore }}</div>
    {% endif %}
    {% if flash %}
      <div class="alert alert-info">{{ flash }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="username">Nickname</label>
        <input type="text" id="username" name="username" required autocomplete="username"
               autofocus placeholder="il-tuo-nickname">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password" placeholder="••••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Accedi</button>
    </form>
  </div>
</div>
</body>
</html>
