<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HoReCa Leads">
  <title>Accedi — HoReCa Leads</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">H</span>
      <div style="font-weight: 700; letter-spacing: -0.02em;">HoReCa Leads</div>
    </div>

    {% if errore %}
      <div class="alert alert-errore">{{ errore }}</div>
    {% endif %}
    {% if flash %}
      <div class="alert alert-info">{{ flash }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="username">Nickname</label>
        <input type="text" id="username" name="username" required autocomplete="username"
               autofocus placeholder="il-tuo-nickname">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password" placeholder="••••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Accedi</button>
    </form>
  </div>
</div>
</body>
</html>
