services:
  # Dashboard privata: http://localhost:8000
  dashboard:
    build: .
    image: hotel-restaurant-scraper:latest
    entrypoint: ["uvicorn"]
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped

  # Scraper da riga di comando (uso: docker compose run --rm scraper --location "...")
  scraper:
    build: .
    image: hotel-restaurant-scraper:latest
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    tty: true
    stdin_open: true
    profiles: ["cli"]
