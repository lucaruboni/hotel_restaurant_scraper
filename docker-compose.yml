services:
  # Dashboard privata: http://localhost:${DASHBOARD_PORT:-8010}
  dashboard:
    build: .
    image: hotel-restaurant-scraper:latest
    entrypoint: ["uvicorn"]
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      # Solo localhost: su un server con IP pubblico (es. istanza cloud) NON
      # deve essere raggiungibile da internet. L'esposizione privata avviene
      # con `tailscale serve` (vedi README), che si collega qui via loopback.
      - "127.0.0.1:${DASHBOARD_PORT:-8010}:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped

  # Scraper da riga di comando (uso: docker compose run --rm scraper --location "...")
  scraper:
    build: .
    image: hotel-restaurant-scraper:latest
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    tty: true
    stdin_open: true
    profiles: ["cli"]
